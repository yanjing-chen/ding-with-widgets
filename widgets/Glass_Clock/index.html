<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../shared/glass.css?v=2">
  <link rel="stylesheet" href="style.css?v=4">
  <title>世界时钟</title>
</head>
<body>
  <main class="clock glass-card">
    <header>
      <div>
        <span class="eyebrow">世界时钟</span>
        <strong>多地时间</strong>
      </div>
      <button id="settings-button" class="icon-button" type="button"
        title="设置城市" aria-label="设置城市">&#9881;</button>
    </header>

    <section id="locations" class="locations" aria-live="polite"></section>

    <section id="settings" class="settings" hidden>
      <div class="settings-head">
        <div><span class="eyebrow">设置</span><strong>管理城市</strong></div>
        <button id="close-settings" class="icon-button" type="button"
          title="完成" aria-label="完成">&#10003;</button>
      </div>

      <div id="location-editor" class="location-editor"></div>

      <form id="city-search">
        <label>
          搜索城市
          <input id="city-query" required minlength="2" maxlength="60"
            autocomplete="off" placeholder="例如：东京、温哥华">
        </label>
        <button id="search-button" class="add-button" type="submit">搜索</button>
      </form>
      <p id="error" role="status" aria-live="polite"></p>
      <div id="search-results" class="search-results"
        aria-label="城市搜索结果"></div>

      <label class="switch-row">
        <span>使用 24 小时制</span>
        <input id="hour-24" type="checkbox" checked>
      </label>
      <label class="setting-slider">
        <span>卡片透明度</span><output id="opacity-value">100%</output>
        <input id="opacity" type="range" min="35" max="100" step="5">
      </label>
    </section>
    <p class="attribution">
      城市数据：<a href="https://open-meteo.com/en/docs/geocoding-api"
        target="_blank" rel="noreferrer">Open-Meteo / GeoNames</a>
    </p>
    <div class="glow"></div>
  </main>
  <script src="clock.js?v=4"></script>
</body>
</html>
