<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../shared/glass.css?v=2">
  <link rel="stylesheet" href="style.css?v=7">
  <title>系统监控</title>
</head>
<body>
  <main class="system-monitor glass-card" data-layout="compact">
    <header class="monitor-head">
      <strong>系统监控</strong>
      <div class="head-actions">
        <span id="updated" class="updated">正在读取…</span>
        <button id="refresh-button" class="icon-button" type="button" title="立即刷新">↻</button>
        <button id="settings-button" class="icon-button" type="button" title="设置">⚙</button>
      </div>
    </header>

    <section id="dashboard" class="dashboard">
      <article id="gauges-card" class="metric-card gauges-card">
        <div id="cpu-panel" class="gauge-panel" data-metric="cpu">
          <div id="cpu-ring" class="usage-ring cpu-ring">
            <div><span>CPU</span><strong id="cpu-value">--%</strong></div>
          </div>
          <span class="metric-glyph cpu-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></svg>
          </span>
          <div class="metric-copy">
            <strong>CPU</strong><b id="cpu-row-value">--%</b>
            <small id="cpu-detail">正在建立采样</small>
          </div>
          <canvas id="cpu-chart" class="mini-chart" aria-label="CPU 使用率曲线"></canvas>
        </div>
        <div id="gpu-panel" class="gauge-panel" data-metric="gpu">
          <div id="gpu-ring" class="usage-ring gpu-ring">
            <div><span id="gpu-label">GPU</span><strong id="gpu-value">--%</strong></div>
          </div>
          <span class="metric-glyph gpu-glyph" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><rect x="7" y="9" width="8" height="6" rx="1"/><path d="M18 9h1m-1 3h1m-1 3h1M8 21h8"/></svg>
          </span>
          <div class="metric-copy">
            <strong id="gpu-row-label">GPU</strong><b id="gpu-row-value">--%</b>
            <small id="gpu-name">正在识别显卡</small>
          </div>
          <canvas id="gpu-chart" class="mini-chart" aria-label="显卡使用率曲线"></canvas>
        </div>
      </article>

      <div id="resources-column" class="metric-card resources-column">
        <article id="memory-card" class="metric-card memory-card" data-metric="memory">
          <div id="memory-ring" class="mini-usage-ring memory-mini-ring" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/><path d="M7 10v4m4-4v4m4-4v4m4-4v4M6 17v2m12-2v2"/></svg>
          </div>
          <div class="resource-body">
            <div class="resource-head"><strong>内存</strong><span id="memory-value">-- / --</span></div>
            <div class="progress-track"><i id="memory-progress"></i></div>
            <small><span id="memory-percent">--%</span> 已使用</small>
          </div>
          <canvas id="memory-chart" class="mini-chart" aria-label="内存使用率曲线"></canvas>
        </article>

        <article id="disk-card" class="metric-card disk-card" data-metric="disk">
          <div class="disk-summary">
            <div id="storage-ring" class="mini-usage-ring storage-mini-ring" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 3h14l2 6v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"/><path d="M3 9h18M8 16h8m2 0h.01"/></svg>
            </div>
            <div class="resource-body">
              <div class="resource-head"><strong>磁盘</strong><span id="storage-value">-- / --</span></div>
              <div class="progress-track disk-progress"><i id="storage-progress"></i></div>
            </div>
          </div>
          <canvas id="disk-chart" class="mini-chart" aria-label="磁盘占用率曲线"></canvas>
          <div class="disk-speeds">
            <span><em>↓</em> 读取 <b id="disk-read">--</b></span>
            <span><em>↑</em> 写入 <b id="disk-write">--</b></span>
          </div>
          <small id="disk-label">全部物理磁盘</small>
        </article>
      </div>

      <article id="network-card" class="metric-card network-card" data-metric="network">
        <div class="network-head">
          <div><strong>网络</strong><small id="network-label">自动选择活动网络</small></div>
          <div class="network-values">
            <span><em>↓</em> 下载 <b id="network-down">--</b></span>
            <span><em>↑</em> 上传 <b id="network-up">--</b></span>
          </div>
        </div>
        <div class="network-charts">
          <canvas id="network-chart" aria-label="最近一分钟下载速度曲线"></canvas>
          <canvas id="network-upload-chart" aria-label="最近一分钟上传速度曲线"></canvas>
        </div>
      </article>
      <p id="empty-state" class="empty-state" hidden>请在设置中至少选择一个监控项目</p>
    </section>
    <p id="status" class="status" role="status"></p>

    <section id="settings" class="settings" hidden>
      <header class="settings-head">
        <div><span class="eyebrow">设置</span><strong>系统监控</strong></div>
        <div class="settings-actions">
          <button id="refresh-devices" class="text-button" type="button">刷新设备</button>
          <button id="close-settings" class="icon-button" type="button" title="完成">✓</button>
        </div>
      </header>

      <fieldset class="metric-settings">
        <legend>显示项目</legend>
        <div id="metric-options" class="metric-options">
          <label><span><i class="dot cpu"></i>CPU</span><input type="checkbox" value="cpu"></label>
          <label><span><i class="dot memory"></i>内存</span><input type="checkbox" value="memory"></label>
          <label><span><i class="dot gpu"></i>显卡</span><input type="checkbox" value="gpu"></label>
          <label><span><i class="dot disk"></i>磁盘</span><input type="checkbox" value="disk"></label>
          <label><span><i class="dot network"></i>网络</span><input type="checkbox" value="network"></label>
        </div>
      </fieldset>

      <div class="device-settings">
        <label><span>显卡</span><select id="gpu-device"><option value="auto">自动选择</option></select></label>
        <label><span>磁盘速度来源</span><select id="disk-device"><option value="all">全部物理磁盘</option></select></label>
        <label><span>网络</span><select id="network-device"><option value="auto">自动选择活动网络</option></select></label>
        <label><span>刷新频率</span><select id="refresh-interval">
          <option value="1">每 1 秒</option><option value="2">每 2 秒</option>
          <option value="3">每 3 秒</option><option value="5">每 5 秒</option>
        </select></label>
      </div>

      <label class="setting-slider">
        <span>卡片透明度</span><output id="opacity-value">100%</output>
        <input id="opacity" type="range" min="35" max="100" step="5">
      </label>
      <p id="settings-status" class="settings-status" role="status"></p>
      <p class="privacy-note">磁盘容量显示系统根文件系统的已用量与总量；读写速度按所选物理磁盘统计。所有数据仅在本机读取。</p>
    </section>
  </main>
  <script src="monitor.js?v=5"></script>
</body>
</html>
