<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../shared/glass.css?v=2">
  <link rel="stylesheet" href="style.css">
  <title>天气</title>
</head>
<body>
  <main class="weather glass-card">
    <header>
      <div class="location-title">
        <span class="eyebrow">天气</span>
        <strong id="location-name">上海</strong>
        <small id="updated">正在更新…</small>
      </div>
      <button id="settings-button" class="icon-button" type="button"
        aria-label="设置城市" title="设置城市">&#9881;</button>
    </header>

    <section class="current">
      <span id="weather-icon" class="weather-icon" aria-hidden="true">☀️</span>
      <div class="temperature"><span id="temperature">--</span><sup>°</sup></div>
      <div class="summary">
        <strong id="condition">等待天气数据</strong>
        <span id="high-low">最高 --° · 最低 --°</span>
      </div>
    </section>

    <section class="details">
      <div><span>体感</span><strong id="apparent">--°</strong></div>
      <div><span>湿度</span><strong id="humidity">--%</strong></div>
      <div><span>风速</span><strong id="wind">-- km/h</strong></div>
    </section>

    <section id="forecast" class="forecast" aria-label="未来四天天气"></section>
    <p id="status" class="status" role="status"></p>
    <a class="attribution" href="https://open-meteo.com/" target="_blank"
      rel="noreferrer">天气与城市数据：Open-Meteo / GeoNames</a>

    <section id="settings" class="settings" hidden>
      <div class="settings-head">
        <div><span class="eyebrow">设置</span><strong>选择城市</strong></div>
        <button id="close-settings" class="icon-button" type="button"
          aria-label="完成" title="完成">&#10003;</button>
      </div>
      <form id="search-form">
        <input id="city-input" required minlength="2" autocomplete="off"
          placeholder="输入城市，例如：上海、阿姆斯特丹">
        <button type="submit">搜索</button>
      </form>
      <p id="search-status" class="search-status" role="status"></p>
      <div id="search-results" class="search-results"></div>
      <label class="setting-slider">
        <span>卡片透明度</span><output id="opacity-value">100%</output>
        <input id="opacity" type="range" min="35" max="100" step="5">
      </label>
      <p class="privacy-note">城市名称仅用于查询经纬度，不需要注册或填写 API Key。</p>
    </section>
  </main>
  <script src="weather.js"></script>
</body>
</html>
